<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Marcos Campos - Product Manager e Aplicacao com IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#111C34"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#fade)" opacity="0.35"/>

  <g stroke="#1E293B" stroke-width="1" opacity="0.6">
    <path d="M760 0 V300 M860 0 V300 M960 0 V300 M1060 0 V300 M1160 0 V300"/>
    <path d="M740 60 H1200 M740 150 H1200 M740 240 H1200"/>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="2.5">
    <path d="M800 210 L890 150 L980 170 L1070 90"/>
  </g>
  <g fill="#0B1120" stroke="url(#accent)" stroke-width="3">
    <circle cx="800" cy="210" r="11"/>
    <circle cx="890" cy="150" r="11"/>
    <circle cx="980" cy="170" r="11"/>
    <circle cx="1070" cy="90" r="13"/>
  </g>
  <g fill="#22D3EE" opacity="0.5">
    <rect x="794" y="245" width="12" height="22" rx="3"/>
    <rect x="884" y="232" width="12" height="35" rx="3"/>
    <rect x="974" y="238" width="12" height="29" rx="3"/>
    <rect x="1064" y="218" width="12" height="49" rx="3"/>
  </g>

  <text x="70" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#F8FAFC" letter-spacing="2">MARCOS CAMPOS</text>
  <rect x="72" y="134" width="96" height="4" rx="2" fill="url(#accent)"/>
  <text x="70" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#E2E8F0">Product Manager · Aplicação com IA</text>
  <text x="70" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#94A3B8">Background full stack em Python, TypeScript e Java</text>
  <text x="70" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#67E8F9" letter-spacing="1.5">DISCOVERY → ESPECIFICAÇÃO → MVP → MÉTRICAS</text>
</svg>
