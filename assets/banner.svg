<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070B18"/><stop offset="45%" stop-color="#160F3A"/><stop offset="100%" stop-color="#0B1030"/>
  </linearGradient>
  <radialGradient id="glowP"><stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/><stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.42"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
  <linearGradient id="line" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#8B9BE8" stroke-opacity="0.06" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>

<rect width="1344" height="576" fill="url(#bg)"/>
